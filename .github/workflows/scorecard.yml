name: Scorecard security audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * 3'  # Weekly on Wednesdays at 2:30 AM UTC

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed for GitHub OIDC token
      id-token: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      with:
        persist-credentials: false

    - name: Run Scorecard analysis
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: results.sarif
        results_format: sarif
        # Public repos don't need token, private repos need PAT with specific permissions
        repo_token: ${{ secrets.SCORECARD_TOKEN }}
        # Publish the results for public repositories
        publish_results: true

    - name: Upload Scorecard results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
      with:
        sarif_file: results.sarif
