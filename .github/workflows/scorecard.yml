name: Scorecard security audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * 3'  # Weekly on Wednesdays at 2:30 AM UTC

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed for GitHub OIDC token
      id-token: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      with:
        persist-credentials: false

    - name: Run Scorecard analysis
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: results.sarif
        results_format: sarif
        # Public repos don't need token, private repos need PAT with specific permissions
        repo_token: ${{ secrets.SCORECARD_TOKEN }}
        # Publish the results for public repositories
        publish_results: true

    - name: Upload Scorecard results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        sarif_file: results.sarif
