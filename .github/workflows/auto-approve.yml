name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@main
    # Pin to specific SHA for supply-chain security:
    # uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      pr-author: 'dependabot[bot],renovate[bot],4alvit'
      required-reviews: '0'
      pr-types: 'all'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
